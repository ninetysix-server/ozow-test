<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>96 Studios Admin Dashboard</title>
  <link rel="icon" href="assets/images/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">

</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">96</div>
        <div><strong>96 Studios</strong><span>Admin Console</span></div>
      </div>
      <a class="nav-link" href="#"><i class="fa-solid fa-grid-2"></i> Orders Dashboard</a>
      <div class="sidebar-footer">
        <button class="signout-btn" id="signOutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out</button>
      </div>
    </aside>

    <section class="main">
      <header class="topbar">
        <div>
          <h1>Orders Dashboard</h1>
          <p>Manage payments and design progress.</p>
        </div>
        <div class="admin-pill" id="adminEmail">Checking access...</div>
      </header>

      <section class="stats">
        <article class="stat"><div class="stat-head"><span>Total Orders</span><span class="stat-icon"><i class="fa-solid fa-receipt"></i></span></div><div class="stat-value" id="totalOrders">0</div></article>
        <article class="stat"><div class="stat-head"><span>Paid Orders</span><span class="stat-icon"><i class="fa-solid fa-circle-check"></i></span></div><div class="stat-value" id="paidOrders">0</div></article>
        <article class="stat"><div class="stat-head"><span>In Design</span><span class="stat-icon"><i class="fa-solid fa-pen-ruler"></i></span></div><div class="stat-value" id="designingOrders">0</div></article>
        <article class="stat"><div class="stat-head"><span>Revenue Paid</span><span class="stat-icon"><i class="fa-solid fa-coins"></i></span></div><div class="stat-value" id="paidRevenue">R0.00</div></article>
      </section>

      <section class="panel">
        <div class="panel-toolbar">
          <div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" placeholder="Search order ID, client ID or service..."></div>
          <div class="filters">
            <select id="paymentFilter">
              <option value="">All payments</option>
              <option>Pending</option><option>Paid</option><option>Failed</option><option>Cancelled</option>
            </select>
            <select id="designFilter">
              <option value="">All design statuses</option>
              <option>Waiting</option><option>Designing</option><option>Review</option><option>Ready</option><option>Completed</option>
            </select>
          </div>
        </div>
        <div id="tableState" class="loading">Loading orders...</div>
        <div class="table-wrap" id="tableWrap" hidden>
          <table>
            <thead><tr><th>Order</th><th>Client</th><th>Service</th><th>Total</th><th>Payment</th><th>Design</th><th>Progress</th><th>Date</th><th></th></tr></thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <div class="modal-overlay" id="orderModal">
    <div class="modal">
      <div class="modal-head"><h2 id="modalTitle">Order Details</h2><button class="close-btn" id="closeModal"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="filePreviewModal">
  <div class="modal" style="width:min(1000px,100%);height:90vh;">
    <div class="modal-head">
      <h2 id="filePreviewTitle">File Preview</h2>

      <button class="close-btn" id="closeFilePreview">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div style="height:calc(90vh - 80px);padding:15px;">
      <iframe
        id="filePreviewFrame"
        style="width:100%;height:100%;border:none;border-radius:12px;">
      </iframe>
    </div>
  </div>
</div>

  <div class="toast" id="toast"></div>

 <script type="module" src="js/admin.js"></script>
</body>
</html>
